name: Frontend CD

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Production Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Deployment ready
        run: echo "Frontend passed production checks."